<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online Math Academy | Class 10 Mathematics</title>

<style>

:root{
    --bg:#f3f5f7;
    --paper:#ffffff;
    --navy:#142b4a;
    --navy-light:#274d73;
    --gold:#b58a4a;
    --text:#263442;
    --muted:#737d88;
    --border:#dce2e8;
    --step-bg:#f8fafc;
    --answer:#c62828;
    --shadow:0 14px 42px rgba(20,43,74,.09);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;

    background:
        radial-gradient(
            circle at 5% 0%,
            rgba(20,43,74,.07),
            transparent 32%
        ),
        radial-gradient(
            circle at 100% 100%,
            rgba(181,138,74,.08),
            transparent 32%
        ),
        var(--bg);

    color:var(--text);

    font-family:
        "Times New Roman",
        Times,
        serif;

    font-style:italic;
}


/* =====================================================
   FRONT PAGE
===================================================== */

.title-page{
    position:relative;

    min-height:330px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:40px 20px 75px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f8fafc
        );

    border:1px solid #d7dde5;

    border-radius:25px;

    box-shadow:var(--shadow);

    overflow:hidden;

    margin-bottom:22px;
}

.title-page::before{
    content:"";

    position:absolute;

    top:14px;
    left:6%;
    right:6%;

    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--gold),
            transparent
        );
}

.title-page::after{
    content:"";

    position:absolute;

    bottom:14px;
    left:6%;
    right:6%;

    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--gold),
            transparent
        );
}

.platform-title{
    color:var(--gold);

    font-size:14px;

    font-weight:700;

    letter-spacing:1.5px;

    margin-bottom:10px;

    font-family:
        "Times New Roman",
        Times,
        serif;

    font-style:italic;
}

.academy-title{
    color:var(--navy);

    font-family:
        "Times New Roman",
        Times,
        serif;

    font-style:italic;

    font-size:clamp(32px,6vw,50px);

    font-weight:700;

    line-height:1.15;
}

.title-divider{
    width:82px;
    height:3px;

    background:var(--gold);

    border-radius:20px;

    margin:15px auto;
}

.class-title{
    color:var(--navy-light);

    font-family:
        "Times New Roman",
        Times,
        serif;

    font-style:italic;

    font-size:clamp(18px,3vw,25px);

    font-weight:600;
}

.unit-title{
    color:var(--muted);

    font-size:14px;

    margin-top:7px;
}

.designed-by{
    position:absolute;

    bottom:32px;

    left:15px;
    right:15px;

    text-align:center;

    color:var(--navy);

    font-family:
        "Times New Roman",
        Times,
        serif;

    font-style:italic;

    font-size:14px;

    font-weight:600;
}

.designed-by strong{
    color:var(--gold);

    font-family:
        "Times New Roman",
        Times,
        serif;

    font-style:italic;
}


/* =====================================================
   SELECTOR
===================================================== */

.selector{
    background:var(--paper);

    border:1px solid var(--border);

    border-radius:20px;

    padding:24px;

    box-shadow:var(--shadow);

    margin-bottom:20px;
}

.selector-title{
    text-align:center;

    color:var(--navy);

    font-family:
        "Times New Roman",
        Times,
        serif;

    font-style:italic;

    font-size:24px;

    font-weight:700;

    margin-bottom:17px;
}

.select-wrapper{
    position:relative;
}

select{
    appearance:none;
    -webkit-appearance:none;

    width:100%;

    padding:16px 50px 16px 18px;

    background:#fff;

    color:var(--text);

    border:1px solid #cbd3dc;

    border-radius:13px;

    font-family:
        "Times New Roman",
        Times,
        serif;

    font-style:italic;

    font-size:18px;

    cursor:pointer;

    outline:none;
}

select:focus{
    border-color:var(--navy);

    box-shadow:
        0 0 0 3px
        rgba(20,43,74,.08);
}

.select-arrow{
    position:absolute;

    right:18px;
    top:50%;

    transform:translateY(-50%);

    color:var(--gold);

    font-size:19px;

    pointer-events:none;
}

.helper{
    text-align:center;

    color:var(--muted);

    font-family:
        "Times New Roman",
        Times,
        serif;

    font-style:italic;

    font-size:13px;

    margin-top:10px;
}


/* =====================================================
   SOLUTION
===================================================== */

.solution{
    display:none;

    background:var(--paper);

    border:1px solid var(--border);

    border-radius:22px;

    padding:28px;

    box-shadow:var(--shadow);
}

.solution.show{
    display:block;

    animation:appear .3s ease;
}

@keyframes appear{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =====================================================
   QUESTION
===================================================== */

.question-box{

    background:
        linear-gradient(
            145deg,
            #f5f7fa,
            #ffffff
        );

    border:1px solid var(--border);

    border-radius:17px;

    padding:28px 18px;

    text-align:center;
}

.question-expression{

    direction:ltr;

    color:var(--navy);

    font-family:
        "Times New Roman",
        Times,
        serif;

    font-style:italic;

    font-size:clamp(30px,5vw,39px);

    line-height:2.15;

    font-weight:600;

    overflow-x:auto;

    white-space:nowrap;
}


/* =====================================================
   SOLUTION HEADING
===================================================== */

.solution-heading{

    color:var(--navy);

    font-family:
        "Times New Roman",
        Times,
        serif;

    font-style:italic;

    font-size:23px;

    font-weight:700;

    margin:27px 0 13px;

    padding-bottom:9px;

    border-bottom:1px solid var(--border);

    text-align:left;
}


/* =====================================================
   FIRST EXPRESSION
===================================================== */

.start-expression{

    direction:ltr;

    background:var(--step-bg);

    border-left:3px solid var(--gold);

    border-radius:9px;

    padding:13px 17px;

    margin-bottom:9px;

    color:var(--navy);

    font-family:
        "Times New Roman",
        Times,
        serif;

    font-style:italic;

    font-size:23px;

    font-weight:600;

    line-height:2.45;

    text-align:left;

    overflow-x:auto;

    white-space:nowrap;
}


/* =====================================================
   STEPS
===================================================== */

.steps{
    direction:ltr;

    text-align:left;
}

.step,
.final-step{

    display:block;

    width:100%;

    background:var(--step-bg);

    border-left:3px solid #c7d0da;

    border-radius:9px;

    padding:11px 17px;

    margin:8px 0;

    color:#293441;

    font-family:
        "Times New Roman",
        Times,
        serif;

    font-style:italic;

    font-size:22px;

    font-weight:400;

    line-height:2.6;

    overflow-x:auto;

    white-space:nowrap;
}


/* FINAL ANSWER */

.final-step{

    color:var(--answer);

    font-weight:500;
}


/* =====================================================
   PROFESSIONAL FRACTION
===================================================== */

.fraction{

    display:inline-flex;

    flex-direction:column;

    align-items:stretch;

    justify-content:center;

    vertical-align:middle;

    width:max-content;

    min-width:1.7em;

    margin:0 .22em;

    color:inherit;

    font-family:
        "Times New Roman",
        Times,
        serif;

    font-style:italic;

    font-size:1em;

    line-height:1;

    position:relative;

    top:.03em;
}

.fraction .numerator,
.fraction .denominator{

    display:block;

    width:max-content;

    min-width:100%;

    white-space:nowrap;

    text-align:center;

    padding-left:.24em;

    padding-right:.24em;
}

.fraction .numerator{

    border-bottom:
        1.8px solid currentColor;

    padding-bottom:.13em;
}

.fraction .denominator{

    padding-top:.13em;
}


/* =====================================================
   BRACKETS
===================================================== */

.big-bracket{

    display:inline-block;

    font-size:1.7em;

    line-height:.72;

    vertical-align:middle;

    font-family:
        "Times New Roman",
        Times,
        serif;

    font-style:italic;
}


/* =====================================================
   POWERS
===================================================== */

sup{

    font-size:.62em;

    line-height:0;

    vertical-align:super;

    margin-left:1px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:650px){

    .container{
        width:94%;
        padding-top:14px;
    }

    .title-page{
        min-height:310px;
        padding:35px 14px 75px;
        border-radius:19px;
    }

    .platform-title{
        font-size:10px;
        letter-spacing:.8px;
    }

    .academy-title{
        font-size:32px;
    }

    .class-title{
        font-size:18px;
    }

    .designed-by{
        bottom:29px;
        font-size:13px;
    }

    .selector{
        padding:17px;
        border-radius:17px;
    }

    select{
        font-size:17px;
        padding:14px 45px 14px 15px;
    }

    .solution{
        padding:17px;
        border-radius:18px;
    }

    .question-box{
        padding:21px 10px;
    }

    .question-expression{
        font-size:27px;
        line-height:2.25;
    }

    .start-expression{
        font-size:21px;
        padding:11px 13px;
        line-height:2.5;
    }

    .step,
    .final-step{
        font-size:19px;
        padding:10px 12px;
        line-height:2.7;
    }

    .fraction{
        font-size:1em;
        margin-left:.15em;
        margin-right:.15em;
    }
}

@media(max-width:390px){

    .academy-title{
        font-size:29px;
    }

    .platform-title{
        font-size:9px;
    }

    .question-expression{
        font-size:24px;
    }

    .start-expression{
        font-size:19px;
    }

    .step,
    .final-step{
        font-size:17.5px;
    }
}

</style>
</head>


<body>

<div class="container">


<!-- =====================================================
     FRONT PAGE
===================================================== -->

<section class="title-page">

    <div class="platform-title">
        Best Online Math Learning Platform
    </div>

    <div class="academy-title">
        Online Math Academy
    </div>

    <div class="title-divider"></div>

    <div class="class-title">
        Class 10 Mathematics
    </div>

    <div class="unit-title">
        Unit 1 · Complex Numbers · Exercise 1.1
    </div>

    <div class="designed-by">

        Designed by

        <strong>
            Bashir Ahmad Mubashar
        </strong>

    </div>

</section>


<!-- =====================================================
     QUESTION SELECTOR
===================================================== -->

<section class="selector">

    <div class="selector-title">
        Select a Question
    </div>

    <div class="select-wrapper">

        <select
            id="questionSelect"
            onchange="showQuestion()">

            <option value="">
                — Select Question —
            </option>

        </select>

        <div class="select-arrow">
            ▾
        </div>

    </div>

    <div class="helper">
        Choose a question to view its complete
        step-by-step solution.
    </div>

</section>


<section
    id="solution"
    class="solution">
</section>


</div>


<script>


/* =====================================================
   FRACTION
===================================================== */

function F(numerator, denominator){

    return `
        <span class="fraction">
            <span class="numerator">
                ${numerator}
            </span>

            <span class="denominator">
                ${denominator}
            </span>
        </span>
    `;
}


/* =====================================================
   QUESTIONS
===================================================== */

const questions = [

{
    statement:`i<sup>5</sup>`,
    selectText:`i⁵`,

    steps:[

        `= i<sup>4</sup> × i`,

        `= (i<sup>2</sup>)<sup>2</sup> × i`,

        `= (−1)<sup>2</sup> × i`,

        `= 1 × i`,

        `= i`

    ]
},


{
    statement:`i<sup>7</sup>`,
    selectText:`i⁷`,

    steps:[

        `= i<sup>6</sup> × i`,

        `= (i<sup>2</sup>)<sup>3</sup> × i`,

        `= (−1)<sup>3</sup> × i`,

        `= −1 × i`,

        `= −i`

    ]
},


{
    statement:`i<sup>8</sup>`,
    selectText:`i⁸`,

    steps:[

        `= (i<sup>2</sup>)<sup>4</sup>`,

        `= (−1)<sup>4</sup>`,

        `= 1`

    ]
},


{
    statement:`i<sup>16</sup>`,
    selectText:`i¹⁶`,

    steps:[

        `= (i<sup>2</sup>)<sup>8</sup>`,

        `= (−1)<sup>8</sup>`,

        `= 1`

    ]
},


{
    statement:`i<sup>17</sup>`,
    selectText:`i¹⁷`,

    steps:[

        `= i<sup>16</sup> × i`,

        `= (i<sup>2</sup>)<sup>8</sup> × i`,

        `= (−1)<sup>8</sup> × i`,

        `= 1 × i`,

        `= i`

    ]
},


{
    statement:`i<sup>25</sup>`,
    selectText:`i²⁵`,

    steps:[

        `= i<sup>24</sup> × i`,

        `= (i<sup>2</sup>)<sup>12</sup> × i`,

        `= (−1)<sup>12</sup> × i`,

        `= 1 × i`,

        `= i`

    ]
},


{
    statement:`i<sup>37</sup>`,
    selectText:`i³⁷`,

    steps:[

        `= i<sup>36</sup> × i`,

        `= (i<sup>2</sup>)<sup>18</sup> × i`,

        `= (−1)<sup>18</sup> × i`,

        `= 1 × i`,

        `= i`

    ]
},


{
    statement:`(−i)<sup>−9</sup>`,
    selectText:`(−i)⁻⁹`,

    steps:[

        `= ${F(
            "1",
            "(−i)<sup>9</sup>"
        )}`,

        `= ${F(
            "1",
            "−i<sup>9</sup>"
        )}`,

        `= ${F(
            "1",
            "−i<sup>8</sup> × i"
        )}`,

        `= ${F(
            "1",
            "−(i<sup>2</sup>)<sup>4</sup> × i"
        )}`,

        `= ${F(
            "1",
            "−(−1)<sup>4</sup> × i"
        )}`,

        `= ${F(
            "1",
            "−1 × i"
        )}`,

        `= ${F(
            "1",
            "−i"
        )}`,

        `= ${F("1","−i")} × ${F("i","i")}`,

        `= ${F(
            "i",
            "−i<sup>2</sup>"
        )}`,

        `= ${F(
            "i",
            "−(−1)"
        )}`,

        `= ${F(
            "i",
            "1"
        )}`,

        `= i`

    ]
},


{
    statement:`(−i)<sup>−19</sup>`,
    selectText:`(−i)⁻¹⁹`,

    steps:[

        `= ${F(
            "1",
            "(−i)<sup>19</sup>"
        )}`,

        `= ${F(
            "1",
            "−i<sup>19</sup>"
        )}`,

        `= ${F(
            "1",
            "−i<sup>18</sup> × i"
        )}`,

        `= ${F(
            "1",
            "−(i<sup>2</sup>)<sup>9</sup> × i"
        )}`,

        `= ${F(
            "1",
            "−(−1)<sup>9</sup> × i"
        )}`,

        `= ${F(
            "1",
            "−(−1) × i"
        )}`,

        `= ${F(
            "1",
            "i"
        )}`,

        `= ${F("1","i")} × ${F("i","i")}`,

        `= ${F(
            "i",
            "i<sup>2</sup>"
        )}`,

        `= ${F(
            "i",
            "−1"
        )}`,

        `= −i`

    ]
},


{
    statement:`27i<sup>−26</sup>`,
    selectText:`27i⁻²⁶`,

    steps:[

        `= ${F(
            "27",
            "i<sup>26</sup>"
        )}`,

        `= ${F(
            "27",
            "(i<sup>2</sup>)<sup>13</sup>"
        )}`,

        `= ${F(
            "27",
            "(−1)<sup>13</sup>"
        )}`,

        `= ${F(
            "27",
            "−1"
        )}`,

        `= −27`

    ]
},


{
    statement:
        `i<sup>11</sup> + i<sup>15</sup>`,

    selectText:
        `i¹¹ + i¹⁵`,

    steps:[

        `= i<sup>10</sup> × i + i<sup>14</sup> × i`,

        `= (i<sup>2</sup>)<sup>5</sup> × i
        + (i<sup>2</sup>)<sup>7</sup> × i`,

        `= (−1)<sup>5</sup> × i
        + (−1)<sup>7</sup> × i`,

        `= −1 × i + −1 × i`,

        `= −i − i`,

        `= −2i`

    ]
},


{
    statement:
        `i<sup>13</sup> × i<sup>11</sup>`,

    selectText:
        `i¹³ × i¹¹`,

    steps:[

        `= i<sup>13+11</sup>`,

        `= i<sup>24</sup>`,

        `= (i<sup>2</sup>)<sup>12</sup>`,

        `= (−1)<sup>12</sup>`,

        `= 1`

    ]
},


{
    statement:
        `i<sup>13</sup> × i<sup>29</sup>`,

    selectText:
        `i¹³ × i²⁹`,

    steps:[

        `= i<sup>13+29</sup>`,

        `= i<sup>42</sup>`,

        `= (i<sup>2</sup>)<sup>21</sup>`,

        `= (−1)<sup>21</sup>`,

        `= −1`

    ]
},


{
    statement:

        `(${F(
            "i<sup>8</sup>",
            "i<sup>5</sup>"
        )})<sup>−5</sup>`,

    selectText:
        `(i⁸ / i⁵)⁻⁵`,

    steps:[

        `= (${F(
            "i<sup>8</sup>",
            "i<sup>5</sup>"
        )})<sup>−5</sup>`,

        `= (i<sup>8−5</sup>)<sup>−5</sup>`,

        `= (i<sup>3</sup>)<sup>−5</sup>`,

        `= i<sup>−15</sup>`,

        `= ${F(
            "1",
            "i<sup>15</sup>"
        )}`,

        `= ${F(
            "1",
            "i<sup>14</sup> × i"
        )}`,

        `= ${F(
            "1",
            "(i<sup>2</sup>)<sup>7</sup> × i"
        )}`,

        `= ${F(
            "1",
            "(−1)<sup>7</sup> × i"
        )}`,

        `= ${F(
            "1",
            "−1 × i"
        )}`,

        `= ${F(
            "1",
            "−i"
        )}`,

        `= ${F(
            "1",
            "−i"
        )} × ${F(
            "i",
            "i"
        )}`,

        `= ${F(
            "i",
            "−i<sup>2</sup>"
        )}`,

        `= ${F(
            "i",
            "−(−1)"
        )}`,

        `= ${F(
            "i",
            "1"
        )}`,

        `= i`

    ]
},


{
    statement:

        `(i<sup>4</sup> + i<sup>3</sup> + i<sup>2</sup> + i)<sup>2</sup>`,

    selectText:
        `(i⁴ + i³ + i² + i)²`,

    steps:[

        `= ((i<sup>2</sup>)<sup>2</sup>
        + i<sup>2</sup> × i
        + i<sup>2</sup>
        + i)<sup>2</sup>`,

        `= ((−1)<sup>2</sup>
        + (−1) × i
        + (−1)
        + i)<sup>2</sup>`,

        `= (1 − i − 1 + i)<sup>2</sup>`,

        `= (0)<sup>2</sup>`,

        `= 0`

    ]
}

];


/* =====================================================
   CREATE SELECT OPTIONS
===================================================== */

const questionSelect =
    document.getElementById(
        "questionSelect"
    );

const solution =
    document.getElementById(
        "solution"
    );


questions.forEach(
    (question,index)=>{

        const option =
            document.createElement(
                "option"
            );

        option.value=index;

        option.textContent =
            question.selectText;

        questionSelect.appendChild(
            option
        );

    }
);


/* =====================================================
   DISPLAY SOLUTION
===================================================== */

function showQuestion(){

    const value =
        questionSelect.value;

    if(value===""){

        solution.classList.remove(
            "show"
        );

        solution.innerHTML="";

        return;
    }


    const question =
        questions[
            Number(value)
        ];


    const stepsHTML =

        question.steps

        .map(
            (step,index)=>{

                const isLast =
                    index ===
                    question.steps.length - 1;

                return `

                    <div class="${
                        isLast
                        ? "final-step"
                        : "step"
                    }">

                        ${step}

                    </div>

                `;

            }
        )

        .join("");


    solution.innerHTML = `

        <div class="question-box">

            <div class="question-expression">

                ${question.statement}

            </div>

        </div>


        <div class="solution-heading">
            Solution
        </div>


        <div class="start-expression">

            ${question.statement}

        </div>


        <div class="steps">

            ${stepsHTML}

        </div>

    `;


    solution.classList.add(
        "show"
    );


    setTimeout(()=>{

        solution.scrollIntoView({

            behavior:"smooth",

            block:"start"

        });

    },70);

}

</script>

</body>
</html>
