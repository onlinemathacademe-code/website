<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online Math Academy | Pakistan Boards</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:"Segoe UI",Arial,sans-serif;
    color:#334155;

    background:
        radial-gradient(
            circle at 8% 8%,
            rgba(96,165,250,.14),
            transparent 30%
        ),
        radial-gradient(
            circle at 92% 12%,
            rgba(139,92,246,.12),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #f9fbff,
            #f5f7ff,
            #ffffff
        );

    overflow-x:hidden;
}


/* =========================
   MAIN
========================= */

main{
    width:min(690px,calc(100% - 30px));
    margin:70px auto 0;
    text-align:center;
}


/* =========================
   PREMIUM TITLE BOX
========================= */

.title-box{
    display:inline-block;
    max-width:100%;

    padding:16px 28px;

    border-radius:18px;

    background:
        linear-gradient(
            105deg,
            #eef4ff 0%,
            #e9f8ff 48%,
            #f1edff 100%
        );

    border:1px solid rgba(150,175,220,.38);

    box-shadow:
        0 12px 32px rgba(49,87,213,.10),
        0 3px 10px rgba(90,100,150,.05);

    position:relative;
    overflow:hidden;

    margin-bottom:17px;
}


.title-box::before{
    content:"";

    position:absolute;

    width:120px;
    height:120px;

    top:-70px;
    right:-35px;

    border-radius:50%;

    background:rgba(255,255,255,.55);

    filter:blur(3px);
}


/* =========================
   TITLE
========================= */

h1{
    position:relative;
    z-index:1;

    font-size:clamp(23px,4vw,32px);

    line-height:1.3;

    font-weight:800;

    letter-spacing:-.25px;

    background:
        linear-gradient(
            90deg,
            #3157d5,
            #168bb8,
            #7657d9
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}


/* =========================
   SUBTITLE
========================= */

.subtitle{
    max-width:560px;

    margin:0 auto 40px;

    color:#7b8799;

    font-size:14px;

    line-height:1.8;

    letter-spacing:.1px;
}


/* =========================
   SELECTION PANEL
========================= */

.panel{
    padding:30px;

    text-align:left;

    background:rgba(255,255,255,.93);

    border:1px solid #e2e8f0;

    border-radius:24px;

    box-shadow:
        0 20px 55px
        rgba(30,55,100,.07);
}


/* =========================
   LABEL
========================= */

label{
    display:block;

    margin-bottom:10px;

    color:#334155;

    font-size:14px;

    font-weight:700;
}


/* =========================
   SELECT WRAPPER
========================= */

.select-wrapper{
    position:relative;

    width:100%;

    margin-bottom:27px;
}


/* =========================
   SELECT
========================= */

select{
    width:100%;

    height:60px;

    padding:
        0 65px
        0 20px;

    appearance:none;
    -webkit-appearance:none;

    outline:none;

    border:1px solid #d8e1ec;

    border-radius:17px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #f8faff
        );

    color:#46556d;

    font-size:15px;

    font-weight:600;

    cursor:pointer;

    transition:.25s ease;
}


select:hover{
    border-color:#9fb4d2;

    box-shadow:
        0 7px 22px
        rgba(49,87,213,.06);
}


select:focus{
    border-color:#6688cf;

    box-shadow:
        0 0 0 4px
        rgba(49,87,213,.09);
}


/* =========================
   ROUND ARROW
========================= */

.select-arrow{
    position:absolute;

    right:10px;
    top:9px;

    width:42px;
    height:42px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    pointer-events:none;

    background:
        linear-gradient(
            135deg,
            #edf4ff,
            #f1edff
        );

    border:1px solid #dbe5f1;

    color:#496795;

    font-size:20px;

    font-weight:700;

    box-shadow:
        0 4px 12px
        rgba(40,70,120,.06);
}


/* =========================
   BOARD SECTION
========================= */

.board-section{
    display:none;

    margin-top:5px;

    padding-top:28px;

    border-top:1px solid #e5eaf1;
}


.board-section.active{
    display:block;

    animation:
        reveal .4s ease;
}


@keyframes reveal{
    from{
        opacity:0;
        transform:translateY(14px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =========================
   OPEN BUTTON
========================= */

.open-button{
    width:100%;

    height:58px;

    border:none;

    border-radius:16px;

    cursor:pointer;

    color:white;

    font-size:15px;

    font-weight:700;

    background:
        linear-gradient(
            100deg,
            #263b83,
            #3157d5,
            #168bb8
        );

    box-shadow:
        0 12px 28px
        rgba(49,87,213,.18);

    transition:.25s ease;
}


.open-button:hover{
    transform:translateY(-2px);

    box-shadow:
        0 16px 34px
        rgba(49,87,213,.23);
}


/* =========================
   MESSAGE
========================= */

.message{
    display:none;

    margin-top:12px;

    padding:12px;

    border-radius:12px;

    text-align:center;

    background:#f5f8fc;

    color:#65758c;

    font-size:13px;
}


.message.show{
    display:block;
}


/* =========================
   FOOTER
========================= */

footer{
    width:min(
        690px,
        calc(100% - 30px)
    );

    margin:
        75px auto 28px;

    padding-top:23px;

    border-top:
        1px solid #e1e7ef;

    text-align:center;

    line-height:1.8;

    color:#8b96a6;

    font-size:13px;
}


.designed{
    display:block;
}


.designed strong{
    background:
        linear-gradient(
            90deg,
            #3157d5,
            #168bb8,
            #7657d9
        );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

    font-weight:800;
}


/* =========================
   PHONE NUMBER
========================= */

.phone{
    display:block;

    margin-top:2px;

    color:#64748b;

    font-size:13px;

    font-weight:600;

    letter-spacing:.5px;
}


/* =========================
   ACADEMY NAME
========================= */

.footer-brand{
    display:block;

    margin-top:3px;

    font-size:15px;

    font-weight:800;

    letter-spacing:.6px;

    background:
        linear-gradient(
            90deg,
            #263b83,
            #3157d5,
            #168bb8,
            #7657d9
        );

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    main{
        width:
            calc(100% - 20px);

        margin-top:52px;
    }


    .title-box{
        padding:
            13px 18px;

        border-radius:16px;

        margin-bottom:15px;
    }


    h1{
        font-size:25px;

        line-height:1.3;
    }


    .subtitle{
        max-width:340px;

        font-size:13px;

        line-height:1.75;

        margin-bottom:30px;
    }


    .panel{
        padding:20px;

        border-radius:21px;
    }


    select{
        height:57px;

        padding-left:17px;

        padding-right:60px;

        font-size:14px;
    }


    .select-arrow{
        width:39px;
        height:39px;

        right:9px;
        top:9px;

        font-size:18px;
    }


    .open-button{
        height:55px;

        font-size:14px;
    }


    footer{
        width:
            calc(100% - 20px);

        margin-top:55px;
    }

}

</style>
</head>


<body>


<main>


    <!-- TITLE -->

    <div class="title-box">

        <h1>
            Easy Access to All Pakistan Boards Websites
        </h1>

    </div>


    <!-- DESCRIPTION -->

    <p class="subtitle">

        Select your province, choose your education board,
        and access its official website directly.

    </p>


    <!-- SELECTION PANEL -->

    <div class="panel">


        <!-- PROVINCE -->

        <label for="province">
            Select Province / Region
        </label>


        <div class="select-wrapper">

            <select
                id="province"
                onchange="loadBoards()">

                <option value="">
                    Select Province / Region
                </option>

                <option value="punjab">
                    Punjab
                </option>

                <option value="sindh">
                    Sindh
                </option>

                <option value="kpk">
                    Khyber Pakhtunkhwa
                </option>

                <option value="balochistan">
                    Balochistan
                </option>

                <option value="federal">
                    Federal / Islamabad
                </option>

                <option value="ajk">
                    Azad Jammu & Kashmir
                </option>

                <option value="gb">
                    Gilgit-Baltistan
                </option>

            </select>


            <div class="select-arrow">
                ↓
            </div>

        </div>


        <!-- BOARD -->

        <div
            id="boardSection"
            class="board-section">


            <label for="board">
                Select Education Board
            </label>


            <div class="select-wrapper">

                <select id="board">

                    <option value="">
                        Select Education Board
                    </option>

                </select>


                <div class="select-arrow">
                    ↓
                </div>

            </div>


            <button
                class="open-button"
                onclick="openBoard()">

                Open Official Board Website
                &nbsp; ↗

            </button>


            <div
                id="message"
                class="message">
            </div>

        </div>

    </div>

</main>



<!-- FOOTER -->

<footer>

    <span class="designed">

        Designed by

        <strong>
            Bashir Ahmad Mubashar
        </strong>

    </span>


    <span class="phone">
        03366808087
    </span>


    <span class="footer-brand">
        Online Math Academy
    </span>

</footer>



<script>


/* =========================
   BOARD DATA
========================= */

const boards = {

    punjab:[

        [
            "BISE Bahawalpur",
            "https://bisebwp.edu.pk/"
        ],

        [
            "BISE Dera Ghazi Khan",
            "https://bisedgkhan.edu.pk/"
        ],

        [
            "BISE Faisalabad",
            "https://www.bisefsd.edu.pk/"
        ],

        [
            "BISE Gujranwala",
            "https://www.bisegrw.edu.pk/"
        ],

        [
            "BISE Lahore",
            "https://www.biselahore.com/"
        ],

        [
            "BISE Multan",
            "https://web.bisemultan.edu.pk/"
        ],

        [
            "BISE Rawalpindi",
            "https://www.biserwp.edu.pk/"
        ],

        [
            "BISE Sahiwal",
            "https://bisesahiwal.edu.pk/"
        ],

        [
            "BISE Sargodha",
            "https://www.bisesargodha.edu.pk/"
        ]

    ],


    sindh:[

        [
            "BISE Hyderabad",
            "https://www.biseh.edu.pk/"
        ],

        [
            "BISE Karachi — Secondary",
            "https://bsek.edu.pk/"
        ],

        [
            "BISE Karachi — Intermediate",
            "https://www.biek.edu.pk/"
        ],

        [
            "BISE Larkana",
            "https://www.biselrk.edu.pk/"
        ],

        [
            "BISE Mirpur Khas",
            "https://www.bisempk.edu.pk/"
        ],

        [
            "BISE Sukkur",
            "https://www.bisesuksindh.edu.pk/"
        ]

    ],


    kpk:[

        [
            "BISE Abbottabad",
            "https://www.biseatd.edu.pk/"
        ],

        [
            "BISE Bannu",
            "https://www.biseb.edu.pk/"
        ],

        [
            "BISE D.I. Khan",
            "https://www.bisedik.edu.pk/"
        ],

        [
            "BISE Kohat",
            "https://www.bisekt.edu.pk/"
        ],

        [
            "BISE Malakand",
            "https://www.bisemalakand.edu.pk/"
        ],

        [
            "BISE Mardan",
            "https://www.bisemdn.edu.pk/"
        ],

        [
            "BISE Peshawar",
            "https://www.bisep.edu.pk/"
        ],

        [
            "BISE Swat",
            "https://www.bisess.edu.pk/"
        ]

    ],


    balochistan:[

        [
            "BBISE Quetta",
            "https://bbise.edu.pk/"
        ]

    ],


    federal:[

        [
            "Federal Board — FBISE",
            "https://www.fbise.edu.pk/"
        ]

    ],


    ajk:[

        [
            "AJK BISE Mirpur",
            "https://ajkbise.net/"
        ]

    ],


    gb:[

        [
            "BISE Gilgit-Baltistan",
            "https://www.fbise.edu.pk/"
        ]

    ]

};



/* =========================
   LOAD BOARDS
========================= */

function loadBoards(){

    const province =
        document.getElementById(
            "province"
        ).value;


    const board =
        document.getElementById(
            "board"
        );


    const section =
        document.getElementById(
            "boardSection"
        );


    const message =
        document.getElementById(
            "message"
        );


    board.innerHTML =
        '<option value="">Select Education Board</option>';


    message.classList.remove(
        "show"
    );


    if(!province){

        section.classList.remove(
            "active"
        );

        return;

    }


    boards[province].forEach(

        function(item,index){

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                index;


            option.textContent =
                item[0];


            board.appendChild(
                option
            );

        }

    );


    section.classList.add(
        "active"
    );


    setTimeout(

        function(){

            section.scrollIntoView({

                behavior:"smooth",

                block:"start"

            });

        },

        200

    );

}



/* =========================
   OPEN BOARD
========================= */

function openBoard(){

    const province =
        document.getElementById(
            "province"
        ).value;


    const board =
        document.getElementById(
            "board"
        );


    const message =
        document.getElementById(
            "message"
        );


    if(
        !province ||
        board.value === ""
    ){

        message.textContent =
            "Please select an education board first.";


        message.classList.add(
            "show"
        );


        return;

    }


    const selected =
        boards[province][
            board.value
        ];


    message.innerHTML =
        "Opening <strong>"
        + selected[0]
        + "</strong>...";


    message.classList.add(
        "show"
    );


    window.open(

        selected[1],

        "_blank",

        "noopener,noreferrer"

    );

}

</script>


</body>
</html>
